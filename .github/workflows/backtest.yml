name: Monthly Backtest & Deploy

on:
  schedule:
    - cron: "0 6 1 * *"   # 1st of every month at 6am UTC
  push:
    branches: [main]
  workflow_dispatch:        # manual trigger from GitHub UI

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  backtest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r agents/personal-config/requirements.txt
          pip install -r agents/strategy/requirements.txt
          pip install -r agents/data-retriever/requirements.txt
          pip install -r agents/backtest/requirements.txt
          pip install -r agents/orchestration/requirements.txt

      - name: Run backtests
        run: |
          python agents/data-retriever/fetch_data.py refresh
          python agents/orchestration/orchestrate.py run

      - name: Commit docs if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          git diff --cached --quiet || git commit -m "chore: update backtest report $(date -u +'%Y-%m-%d')"
          git push

  # deploy-pages is enabled once the repo is made public.
  # GitHub Pages requires a public repo on free plans.
